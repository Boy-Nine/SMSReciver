services:
  sms-receiver:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      SMS_ADMIN_TOKEN: admin123
      SMS_HOST: 0.0.0.0
      SMS_PORT: 8080
    volumes:
      - sms_data:/app/data

volumes:
  sms_data:
