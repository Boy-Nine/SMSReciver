# 示例：与现有 3000 业务共存，验证码后台走 8080
# 安装：sudo cp docs/nginx-makemoneies.top.conf /etc/nginx/sites-available/makemoneies.top
#       sudo ln -sf /etc/nginx/sites-available/makemoneies.top /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# Docker 须映射到本机 8080（见 docker-compose.yml），勿占用 80/443

# HTTP → HTTPS
server {
    listen 80;
    server_name makemoneies.top www.makemoneies.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name makemoneies.top www.makemoneies.top;

    ssl_certificate     /etc/nginx/ssl/www.makemoneies.top.pem;
    ssl_certificate_key /etc/nginx/ssl/www.makemoneies.top.key;

    # 无尾斜杠时跳转到 /sms/
    location = /sms {
        return 301 https://$host/sms/;
    }

    # 验证码后台（FastAPI Docker 127.0.0.1:8080，含 /sms/api/ 接口）
    location /sms/ {
        proxy_pass http://127.0.0.1:8080/sms/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 原有业务
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
